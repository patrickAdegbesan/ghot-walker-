{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1>My profile</h1>
<form method="post" class="form" novalidate>
  <div class="field">
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" required
           value="{{ current_user.full_name }}" autocomplete="name">
  </div>
  <div class="field">
    <label>Email address</label>
    <p>{{ current_user.email }} <span class="help">(cannot be changed)</span></p>
  </div>
  <div class="field">
    <label>Account number</label>
    <p>{{ current_user.account_number }} <span class="help">(cannot be changed)</span></p>
  </div>
  <div class="field">
    <label for="phone">Phone number</label>
    <input type="tel" id="phone" name="phone" value="{{ current_user.phone }}"
           autocomplete="tel">
  </div>
  <div class="field">
    <label for="address">Home / delivery address</label>
    <textarea id="address" name="address" rows="2">{{ current_user.address }}</textarea>
  </div>
  <div class="field">
    <label for="new_password">New password
      <span class="help">(leave blank to keep your current password)</span></label>
    <input type="password" id="new_password" name="new_password" minlength="6"
           autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary">Save changes</button>
</form>
{% endblock %}
