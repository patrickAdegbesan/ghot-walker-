{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create your account</h1>
<form method="post" class="form" novalidate>
  <div class="field">
    <label for="full_name">Full name</label>
    <input type="text" id="full_name" name="full_name" required
           value="{{ form.get('full_name', '') }}" autocomplete="name">
  </div>
  <div class="field">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" required
           value="{{ form.get('email', '') }}" autocomplete="email">
  </div>
  <div class="field">
    <label for="phone">Phone number</label>
    <input type="tel" id="phone" name="phone" required
           value="{{ form.get('phone', '') }}" autocomplete="tel">
  </div>
  <div class="field">
    <label for="account_number">Bank account number (10 digits)</label>
    <input type="text" id="account_number" name="account_number" required
           inputmode="numeric" pattern="[0-9]{10}" maxlength="10"
           value="{{ form.get('account_number', '') }}"
           aria-describedby="acct-help">
    <p id="acct-help" class="help">Your 10-digit NUBAN account number.</p>
  </div>
  <div class="field">
    <label for="address">Home address (used for card delivery)</label>
    <textarea id="address" name="address" rows="2">{{ form.get('address', '') }}</textarea>
  </div>
  <div class="field">
    <label for="password">Password (minimum 6 characters)</label>
    <input type="password" id="password" name="password" required minlength="6"
           autocomplete="new-password">
  </div>
  <div class="field">
    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required
           autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-primary">Register</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
